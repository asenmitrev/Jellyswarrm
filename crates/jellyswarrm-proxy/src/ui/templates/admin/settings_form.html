<div id="settings-messages"></div>
<form hx-post="/{{ ui_route }}/settings/save" hx-target="#settings-form" hx-swap="innerHTML" hx-disabled-elt="this">
  <fieldset>
    <label>Server ID
      <input type="text" name="server_id" value="{{ server_id }}" disabled>
    </label>
    <label>Public Address
      <input type="text" name="public_address" value="{{ public_address }}" required>
    </label>
    <label>Server Name
      <input type="text" name="server_name" value="{{ server_name }}" required>
    </label>
    <label>Add Server Names to Media
      <input type="checkbox" role="switch" name="include_server_name_in_media" value="true" {% if include_server_name_in_media %}checked{% endif %}>
    </label>
    <label>Auto Create Users On Login
      <input type="checkbox" role="switch" name="auto_create_users_on_login" value="true" {% if auto_create_users_on_login %}checked{% endif %}>
    </label>
    <label>Merge Duplicate Movies & Shows Across Servers
      <input type="checkbox" role="switch" name="deduplicate_media" value="true" {% if deduplicate_media %}checked{% endif %}>
    </label>
  </fieldset>
  <fieldset>
    <legend>Seerr for Moonfin clients</legend>
    <label>Enable Seerr
      <input type="checkbox" role="switch" name="seerr_enabled" value="true" {% if seerr_enabled %}checked{% endif %}>
    </label>
    <label>Seerr URL
      <input type="url" name="seerr_url" value="{{ seerr_url }}" placeholder="http://seerr:5055">
    </label>
    <label>Display Name
      <input type="text" name="seerr_display_name" value="{{ seerr_display_name }}" placeholder="Seerr">
    </label>
    <p style="font-size:.75rem; opacity:.7;">Seerr must be connected to this Jellyswarrm instance. Jellyswarrm reaches Seerr at this URL, and Moonfin clients are also given it.</p>
  </fieldset>
  <div style="display:flex; gap:.5rem;">
    <button type="submit">Save</button>
    <button type="button" hx-get="/{{ ui_route }}/settings/form" hx-target="#settings-form" class="secondary">Reset</button>
    <button type="button" hx-post="/{{ ui_route }}/settings/reload" hx-target="#settings-messages" class="secondary">Reload From Disk</button>
  </div>
  <p style="font-size:.75rem; opacity:.7; margin-top:.5rem;">Edits persist to TOML.</p>
</form>
